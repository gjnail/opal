name: Terminal

# Opal Terminal is a nested module (terminal/), so the root CI doesn't build
# it. It imports the CLI's theme, config and platform packages, so changes
# there run this too, and so do changes to the install scripts, which build
# it from a checkout.
on:
  push:
    branches: [main]
    paths: ["terminal/**", "internal/**", "install/**", "go.mod", "go.sum", ".github/workflows/terminal.yml"]
  pull_request:
    paths: ["terminal/**", "internal/**", "install/**", "go.mod", "go.sum", ".github/workflows/terminal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: terminal/go.sum
      # Gio needs cgo and these headers on Linux.
      - name: Install Gio's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -ldflags=-H=windowsgui -o opal-terminal.exe .
          else
            go build -o opal-terminal .
          fi
          ls -l opal-terminal*

      # The install scripts build and install both programs from the
      # checkout, the terminal the same way a release packages it
      # (scripts/package.sh on macOS and Linux).
      - name: Install from the checkout
        if: runner.os != 'Windows'
        working-directory: .
        env:
          OPAL_NO_SETUP: "1"
          OPAL_WITH_TERMINAL: "1"
        run: |
          ./install/install.sh
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --strict "$HOME/Applications/Opal Terminal.app"
          else
            test -f "$HOME/.local/share/applications/opal-terminal.desktop"
          fi
          "$HOME/.local/bin/opal" terminal -version
      - name: Install from the checkout (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          ./install/install.ps1 -NoSetup
          & "$env:LOCALAPPDATA\opal\bin\opal.exe" terminal -version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in 'opal-terminal.exe', 'conpty.dll', 'OpenConsole.exe', 'shell\usr\bin\bash.exe') {
            if (-not (Test-Path "$env:LOCALAPPDATA\opal\terminal\$f")) { throw "$f wasn't installed" }
          }
          # Opal Bash starts the way Opal Terminal starts it, finds its own
          # tools, and loads opal.
          $out = & "$env:LOCALAPPDATA\opal\terminal\shell\usr\bin\bash.exe" --noprofile --rcfile /etc/opal/bashrc -i -c 'command -v sed awk grep find less; type -t _opal_precmd' 2>$null
          $out
          if (($out -join "`n") -notmatch '/usr/bin/sed[\s\S]*/usr/bin/less[\s\S]*function') { throw 'Opal Bash did not start as expected' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Opal Terminal.lnk")) { throw 'no Start menu shortcut' }
