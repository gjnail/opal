name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # go.mod says Go 1.22, so make sure that still builds. The other jobs use
  # the current release: binaries from Go 1.23 and older don't load on recent
  # macOS (dyld requires an LC_UUID load command, which Go writes from 1.24).
  minimum-go:
    name: Go 1.22 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Load opal into real shells and check the prompt, aliases, completion and
  # history hooks.
  shells-linux:
    name: Shells (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: go build -o "$RUNNER_TEMP/bin/opal" . && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: bash
        run: bash --norc -i test/smoke.bash
      - name: zsh
        run: zsh -f -i test/smoke.zsh
      - name: fish
        run: fish --no-config -i test/smoke.fish
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File test/smoke.ps1
      - name: Show what opal generated (on failure)
        if: failure()
        run: |
          OPAL_SHELL=bash opal doctor || true
          opal init bash > "$RUNNER_TEMP/init.bash"
          /bin/bash -n "$RUNNER_TEMP/init.bash" && echo "init.bash parses with /bin/bash $(/bin/bash -c 'echo $BASH_VERSION')"
          /bin/bash --norc -i -c 'shopt expand_aliases; eval "$(opal init bash)"; shopt expand_aliases; alias | wc -l' 2>&1 || true
          echo "--- traced re-run of the bash smoke test"
          /bin/bash --norc -i -x test/smoke.bash > "$RUNNER_TEMP/trace.txt" 2>&1 || true
          grep -n -E 'expand_aliases|unalias|posix|shopt|source |^\++ \. ' "$RUNNER_TEMP/trace.txt" | head -60 || true

  shells-macos:
    name: Shells (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build -o "$RUNNER_TEMP/bin/opal" . && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: bash 3.2 (the version macOS ships)
        run: /bin/bash --norc -i test/smoke.bash
      - name: zsh
        run: zsh -f -i test/smoke.zsh
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File test/smoke.ps1
      - name: Show what opal generated (on failure)
        if: failure()
        run: |
          OPAL_SHELL=bash opal doctor || true
          opal init bash > "$RUNNER_TEMP/init.bash"
          /bin/bash -n "$RUNNER_TEMP/init.bash" && echo "init.bash parses with /bin/bash $(/bin/bash -c 'echo $BASH_VERSION')"
          /bin/bash --norc -i -c 'shopt expand_aliases; eval "$(opal init bash)"; shopt expand_aliases; alias | wc -l' 2>&1 || true
          echo "--- traced re-run of the bash smoke test"
          /bin/bash --norc -i -x test/smoke.bash > "$RUNNER_TEMP/trace.txt" 2>&1 || true
          grep -n -E 'expand_aliases|unalias|posix|shopt|source |^\++ \. ' "$RUNNER_TEMP/trace.txt" | head -60 || true

  shells-windows:
    name: Shells (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\bin\opal.exe" .
          "$env:RUNNER_TEMP\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/smoke.ps1
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File test/smoke.ps1
      - name: Git Bash
        shell: bash
        run: bash --norc -i test/smoke.bash
      - name: Show what opal generated (on failure)
        if: failure()
        shell: pwsh
        run: |
          $env:OPAL_SHELL = 'pwsh'; opal doctor
          opal init pwsh

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null . || exit 1
            echo "built $target"
          done
