name: Release

# Pushing a tag such as v0.1.0 builds opal for Windows, macOS and Linux and
# opens a draft GitHub release with the archives. Running the workflow by
# hand (Actions > Release > Run workflow) builds the archives without a
# release. See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go 1.24+ writes the LC_UUID that macOS needs to load the binary.
          go-version: stable

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-dev+${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The release notes are the CHANGELOG.md section for this version.
      - name: Release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # The licenses of every Go module opal is built with, for all archives.
      # Fails if a module has no license file.
      - name: Third-party licenses
        run: |
          {
            echo "opal is built with the Go modules below. Their licenses follow."
            go list -deps -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Version}} {{.Dir}}{{end}}{{end}}' . |
              sort -u |
              while read -r path version dir; do
                lic=$(ls "$dir" | grep -iE '^(licen[cs]e|copying)' | head -1)
                if [ -z "$lic" ]; then
                  echo "::error::$path has no license file" >&2
                  exit 1
                fi
                printf '\n%s\n%s %s\n%s\n\n' "========================================================================" "$path" "$version" "========================================================================"
                cat "$dir/$lic"
              done
          } > THIRD-PARTY-LICENSES.txt
          head -20 THIRD-PARTY-LICENSES.txt

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            # Stable names, so the install scripts and `opal update` can use
            # releases/latest/download/<name>.
            name="opal_${os}_${arch}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X opal/internal/cli.Version=$VERSION" -o "build/$name/opal$ext" .
            cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.txt "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -xzf dist/opal_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          opal="$RUNNER_TEMP/opal_linux_amd64/opal"
          "$opal" version | grep -F "$VERSION"
          "$opal" init bash | bash -n
          "$opal" init zsh > /dev/null
          "$opal" init pwsh | LC_ALL=C grep -q '[^[:print:][:space:]]' && { echo "::error::PowerShell init isn't ASCII"; exit 1; } || true

      - uses: actions/upload-artifact@v7
        with:
          name: opal-${{ steps.version.outputs.version }}
          path: dist/*

      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*

      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat >> notes.md <<EOF

          ## Downloads

          The install scripts pick the right file for you (see the [README](https://github.com/$GITHUB_REPOSITORY#install)).

          | System | File |
          |---|---|
          | Windows (x64 / ARM64) | \`opal_windows_amd64.zip\` / \`opal_windows_arm64.zip\` |
          | macOS (Intel / Apple Silicon) | \`opal_darwin_amd64.tar.gz\` / \`opal_darwin_arm64.tar.gz\` |
          | Linux (x86_64 / ARM64) | \`opal_linux_amd64.tar.gz\` / \`opal_linux_arm64.tar.gz\` |

          The binaries aren't code-signed. To check that a download was built from this repository, compare it with \`SHA256SUMS.txt\` or run \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "opal $VERSION" --notes-file notes.md
