name: Bug report
description: Something doesn't work, or the prompt looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! If this could make a shell run a command it
        shouldn't, please report it privately instead (see SECURITY.md).

        Please check that anything you paste doesn't show paths, hostnames or
        commands you'd rather keep private.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux, WSL, Other]
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [PowerShell 7, Windows PowerShell 5.1, zsh, bash, Git Bash, fish, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: opal version and shell version
      placeholder: opal 0.1.0, zsh 5.9
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Windows Terminal, iTerm2, GNOME Terminal, VS Code...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new terminal
        2. cd into ...
  - type: textarea
    id: doctor
    attributes:
      label: Output of `opal doctor`
      render: text
