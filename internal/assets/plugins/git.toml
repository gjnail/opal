name = "git"
description = "Oh My Zsh's git aliases (gst, gco, gp and the rest) plus main-branch helpers"
requires = ["git"]

[aliases]
g     = "git"
ga    = "git add"
gaa   = "git add --all"
gapa  = "git add --patch"
gb    = "git branch"
gba   = "git branch --all"
gbd   = "git branch --delete"
gc    = "git commit --verbose"
gca   = "git commit --verbose --all"
gcam  = "git commit --all --message"
gcmsg = "git commit --message"
gcb   = "git checkout -b"
gco   = "git checkout"
gcl   = "git clone --recurse-submodules"
gcp   = "git cherry-pick"
gcf   = "git config --list"
gd    = "git diff"
gds   = "git diff --staged"
gf    = "git fetch"
gfa   = "git fetch --all --prune"
gl    = "git pull"
glo   = "git log --oneline --decorate"
glog  = "git log --oneline --decorate --graph"
gloga = "git log --oneline --decorate --graph --all"
gm    = "git merge"
gp    = "git push"
gpf   = "git push --force-with-lease"
gpsup = "git push --set-upstream origin HEAD"
gr    = "git remote"
grv   = "git remote --verbose"
grb   = "git rebase"
grbi  = "git rebase --interactive"
grba  = "git rebase --abort"
grbc  = "git rebase --continue"
grh   = "git reset"
grhh  = "git reset --hard"
grs   = "git restore"
grst  = "git restore --staged"
gsh   = "git show"
gsta  = "git stash push"
gstp  = "git stash pop"
gstl  = "git stash list"
gst   = "git status"
gss   = "git status --short"
gsw   = "git switch"
gswc  = "git switch --create"

[functions.gcm]
desc = "Check out the main branch (main, trunk, master... whatever this repo uses)"
sh   = 'git checkout "$(opal git main-branch)" "$@"'
fish = 'git checkout (opal git main-branch) $argv'
pwsh = 'git checkout (opal git main-branch) @args'

[functions.gswm]
desc = "Switch to the main branch"
sh   = 'git switch "$(opal git main-branch)" "$@"'
fish = 'git switch (opal git main-branch) $argv'
pwsh = 'git switch (opal git main-branch) @args'

[functions.grbm]
desc = "Rebase onto the main branch"
sh   = 'git rebase "$(opal git main-branch)" "$@"'
fish = 'git rebase (opal git main-branch) $argv'
pwsh = 'git rebase (opal git main-branch) @args'
